services:
  postgres:
    container_name: goblin-postgres
    hostname: postgres
    image: postgres:18
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goblin
    volumes:
      - goblin-postgres-data:/var/lib/postgresql
    networks:
      - goblin_network

  valkey:
    container_name: goblin-valkey
    hostname: valkey
    image: valkey/valkey:9
    ports:
      - "56379:6379"
    command: valkey-server --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - goblin-valkey-data:/data
    networks:
      - goblin_network

  goblin:
    container_name: goblin-server
    hostname: goblin
    build:
      context: src/
    ports:
      - "5177:8080"
    networks:
      - goblin_network
    env_file:
      - .env
    depends_on:
      valkey:
        condition: service_healthy

networks:
  goblin_network:

volumes:
  goblin-postgres-data:
  goblin-valkey-data:
